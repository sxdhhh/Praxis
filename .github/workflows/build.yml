name: build

# 触发条件
#
# 1. 手动：Actions 页点「Run workflow」，可选 task 与是否上传产物。
# 2. push：只在改到会影响 APK 的路径时跑（纯文档/协议提交不浪费 runner）。
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Gradle 任务'
        required: true
        default: assembleDebug
        type: choice
        options:
          - assembleDebug
          - assembleRelease
      upload_artifact:
        description: '是否上传 APK 产物'
        required: false
        default: true
        type: boolean
  push:
    # ## 为什么两个分支名都留
    #
    # GitHub 默认分支是 `main`，本地长期是 `master`。只写一个的后果是
    # 「推上去了但 CI 一次没跑」，而且 Actions 页看不出异常（就是没记录）。
    branches: [main, master]
    paths:
      - 'app/**'
      - 'core/**'
      - 'feature/**'
      - 'ui/**'
      - 'third_party/**'
      - 'gradle/**'
      - 'build-plugins/**'
      # ## 为什么必须带上 preview/**（2026-11-01 补）
      #
      # verify job 要跑 `testDebugUnitTest`，那会把 :preview 的测试源码
      # 一起编译。但 preview/** 原来不在这个清单里 —— 于是改了 preview
      # 不会触发 CI，而 build job 的 assembleDebug 又不编译测试源码。
      # 结果就是 preview 里的编译错误可以一直躺着：本地看不到（禁令下
      # 不编译）、CI 也不跑。ScreenPreviewTest.kt 用 1.x 的
      # `roundedCorners` 参数就是这样拖到 2026-11-01 才被发现的。
      - 'preview/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      # ## 为什么 `docs/**` 与 `tools/**` 故意不在清单里
      #
      # 这两类目录只放文档与开发期脚本，不参与任何 Gradle 编译。
      # 放进来只会让「改了一句文档」也触发一次完整构建，白占 CI 额度。
      # （真机验证脚本在 tools/，改它不需要重新出 APK。）
      - '.github/workflows/build.yml'

# 同一分支的新提交取消上一次未跑完的（手动触发不取消）。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # ── 静态检查 + 单测 ───────────────────────────────────
  #
  # 与 build 并行。`assembleDebug` 能拦住 Kotlin 编译错误，但**一行测试都不跑**：
  # `WiringGuardTest` 这类接线护栏写完了 CI 依旧绿 —— 护栏不跑等于没有。
  # 同理 lint：`abortOnError = true` 配好了但从没在 CI 执行过。
  verify:
    runs-on: ubuntu-latest
    # ## 为什么是 90 而不是 60（2026-11-07，R15 放宽）
    #
    # 这一步现在要跑 9 个**纯 JVM 模块**的测试（R12 修的覆盖漏洞），
    # 那是以前完全不跑的负载。加上 :app 逐类（6 x 4 分钟）与 lint，
    # 60 分钟已经不够：
    #
    #     库模块 40 + :app 24 + lint 5 = 69
    #
    # 与 release job 取同一个上限，避免两个 job 的心智模型不一致。
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ## 为什么是 21 而不是 17
      #
      # `build-plugins/PraxisBuildConfig.kt` 里 `JDK_VERSION = 21`，
      # 所有模块都 `jvmToolchain(21)`。CI 用 17 会在配置阶段直接报
      # 「No matching toolchains found」。
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ## 为什么必须自己装 platform 37
      #
      # `PraxisBuildConfig.COMPILE_SDK = 37`。runner 预装的 SDK 通常停在 34/35，
      # 直接构建会报「Failed to find target with hash string android-37」。
      # ## 为什么不是直揃 `sdkmanager "platforms;android-37"`
      #
      # 实测会失败：`Failed to find package 'platforms;android-37'`。
      # 原因：37 还没进稳定通道。它在 **canary 通道**，而且要带 minor
      # 版本号（包名是 `platforms;android-37.0`，对应本机 `android-37.0/`
      # 目录里的 `AndroidVersion.ApiLevel=37.0`）。
      #
      # 所以：先开 canary 通道，再装 `android-37.0`。
      # 容错：如果上游仍找不到（通道改名 / 版本上调），**不阻断构建** ——
      # 让 Gradle 自己报「缺 platform」，那比在装 SDK 阶段就停下更好排查。
      - name: Install Android SDK platform 37
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::warning::sdkmanager 不在预期路径，跳过（由 Gradle 自己报缺 platform）"
            exit 0
          fi
          # 先试稳定包名，再试 canary 通道的 37.0
          set +e
          yes | "$SDKMANAGER" --install "platforms;android-37" > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "稳定通道没有 android-37，改试 canary 通道的 android-37.0"
            yes | "$SDKMANAGER" --channel=3 --install "platforms;android-37.0" > /dev/null 2>&1
          fi
          # build-tools 37 同样可能不存在；存在就装，不存在用现有的。
          yes | "$SDKMANAGER" --install "build-tools;37.0.0" > /dev/null 2>&1
          set -e
          echo "当前已装 platforms:"
          ls "$ANDROID_SDK_ROOT/platforms" 2>/dev/null || true
          echo "当前已装 build-tools:"
          ls "$ANDROID_SDK_ROOT/build-tools" 2>/dev/null || true

      # ## 为什么 CI 要单独调大堆
      #
      # 首次 CI 实测失败：`java.lang.OutOfMemoryError: Metaspace`
      # （Kotlin FIR 解析阶段炸的，不是编译出错）。
      #
      # `gradle.properties` 里是 `-Xmx2g -XX:MaxMetaspaceSize=768m` —— 那是为
      # **本地 proot 省内存**定的（见该文件的注释），不是给 CI 的。
      # 18 个模块 + Compose 编译器插件生成大量合成类，768m Metaspace 不够。
      #
      # runner 有 7GB+，直接给 4g 堆 / 2g Metaspace。
      # 只在 CI 这一次性 checkout 里改，不提交回仓库 —— 本地 proot 仍然用
      # gradle.properties 里的 2g / 768m（那个值是为省宿主内存定的）。
      #
      # ## 为什么不能整个替换 gradle.properties（2026-11-01 修）
      #
      # 原来的写法是「写一份 gradle.properties.ci 再 mv 覆盖」。那会把仓库里
      # 其余配置一并抹掉 —— android.useAndroidX、android.nonTransitiveRClass、
      # org.gradle.parallel / caching / configuration-cache、
      # kotlin.compiler.execution.strategy=in-process 全部消失。
      # 其中缺 useAndroidX 会让 AGP 直接拒绝构建。
      #
      # 改成只替换 jvmargs 这一行、再追加两项，原有内容不动。
      - name: Tune Gradle memory for CI
        run: |
          # ## 为什么从 -Xmx4g 降到 -Xmx3g（2026-11-05）
          #
          # GitHub 标准 runner 只有 7 GB RAM，而这里是
          # org.gradle.parallel=true + max-workers=8，测试阶段还会
          # 再起若干 worker JVM（每个默认 512 MB 堆）。
          # 「4g Gradle 堆 + 2g Metaspace + N 个 worker」在 7 GB 上
          # 会进入 swap 抖动。
          #
          # 而仓库自己的 gradle.properties 已经描述过这个症状：
          #
          #   「峰值直接把宿主压进 LMK —— 现象是构建日志在某个
          #    > Task :xxx:... 行戛然而止：没有 BUILD FAILED、
          #    没有 hs_err、没有 OOM 堆栈，进程直接消失。」
          #
          # 这与 CI 上「日志停在 > Task :app:testDebugUnitTest 一行、
          # 十几分钟不返回」的形态一致。
          #
          # 3g 与仓库本地取值对齐（本地注释同样论证过
          # 「宁可慢一点，也不要被杀掉重跑一次」）。
          sed -i 's|^org\.gradle\.jvmargs=.*|org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dfile.encoding=UTF-8|' gradle.properties
          {
            echo "kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g"
          } >> gradle.properties
          echo "--- gradle.properties (CI) ---"
          cat gradle.properties
          # 守一道：缺 useAndroidX 时 AGP 会拒绝构建，早点报比编译阶段炸好
          grep -q '^android.useAndroidX=true' gradle.properties \
            || { echo "::error::gradle.properties 丢了 android.useAndroidX"; exit 1; }

      # local.properties 不进仓库（含本机 SDK 路径），CI 里现造一份。
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # ## 为什么把单测拆成「库模块」与「:app 逐类」两步（2026-11-05）
      #
      # `./gradlew testDebugUnitTest` 一把梭会在 `:app:testDebugUnitTest` 上
      # **无限等下去** —— Gradle 默认不给测试任务设超时。
      #
      # 已经试过两条路，都失败：
      #
      #   1. Gradle 任务级 `Test.timeout`（4 分钟）—— 实测跑到 13 分钟仍未结束；
      #   2. JUnit `@Rule Timeout`（6 个 :app 测试类各加 30 秒）—— 一次都没触发。
      #
      # 第 2 条是最有价值的观测：JUnit 规则包住的是**每个测试方法**，
      # 它不触发就说明卡的地方**不在任何测试方法内**，而在任务 / JVM 层。
      #
      # 所以改用最外层的手段：**shell 的 `timeout`**。
      # 它不认识 Gradle、也不认识 JUnit，只在墙钟到点时杀进程 ——
      # 恰恰因为「什么都不懂」，它不会被上面任何一层的问题绕过。
      #
      # 并且 `:app` **逐个测试类跑**：超时失败时能直接看出是哪一个类，
      # 而不是只知道「这个任务卡了」。
      # 库模块这步也加墙钟上界：它同样出现过长时间不返回
      # （约 20 分钟，历史正常值 1~2 分钟）。job 级的
      # timeout-minutes 虽然最终也会杀，但那是 90 分钟之后 ——
      # 期间整个并发队列都被占住。
      #
      # ## 为什么从 25 分钟放宽到 40（2026-11-07，R15）
      #
      # 25 分钟那个取值是在「这一步只跑 Android 模块」时定的。R12 修好覆盖
      # 漏洞后，它还要跑 9 个纯 JVM 模块 —— 负载翻了一倍不止，实测超过 25 分钟
      # 仍未结束。
      #
      # 40 分钟仍然「真卡则快速给出失败」，但给正常的全量跑留了余量；
      # 同时 job 上限提到 90，避免它被 job 级砍掉而看不出是哪一步慢。
      # ## 为什么要显式列出 9 个纯 JVM 模块（2026-11-07，R12 补）
      #
      # testDebugUnitTest 是 **Android 插件**的任务名。纯 JVM 模块
      # （praxis.kotlin.jvm）的任务叫 test —— 任务名匹配在它们身上直接落空，
      # 不报错、不执行。
      #
      # 后果不是「少跑一点」，而是这 9 个模块的测试**从建立起从未在 CI 上
      # 编译过**。攒出来的债：core:model 的测试里写了一个 Python 风格的
      # chr(31)（Kotlin 根本没这个函数），core:ai 有两个编译错误 + 四个
      # 一直失败的用例，长期无人发现。
      #
      # ## 为什么不用 ./gradlew test 一把梭
      #
      # test 会匹配**所有**模块 —— Android 模块也有一个聚合的 test
      # （依赖 testDebugUnitTest + testReleaseUnitTest）。一把梭会让每个
      # Android 模块的测试跑两遍（debug 与 release），CI 时间直接翻倍。
      #
      # 所以显式列出。代价是新增 JVM 模块时要记得加 ——
      # 但漏加的后果会在「那个模块的测试从没跑过」时暴露，比时间翻倍可控。
      - name: Unit tests (library modules)
        run: |
          timeout --signal=KILL 2400 ./gradlew \
            testDebugUnitTest \
            -x :app:testDebugUnitTest \
            -x :feature:chat:testDebugUnitTest \
            -x :core:ai:test \
            -x :core:goal:test \
            -x :core:linux:test \
            -x :core:memory:test \
            -x :core:model:test \
            -x :core:plugin:test \
            -x :core:terminal:test \
            -x :core:tool:test \
            -x :core:workflow:test \
            --stacktrace

      # ## 纯 JVM 模块的测试 —— 观察模式（2026-11-07 起）
      #
      # ## 为什么单独一步且 continue-on-error
      #
      # 这 9 个模块的任务名是 \`test\`（不是 \`testDebugUnitTest\`），
      # 所以它们**从建立起从未在 CI 上编译过** —— R12 才发现这个覆盖漏洞。
      #
      # 补上之后暴露了一批**既有失败**（与本次聊天重构无关，都是积攒下来的）：
      #
      #   - core:plugin  130 个测试中 9 个失败（scanAll 的排序/启停/安装/id 校验）
      #   - 其余模块已清零（R12~R15 逐个修过：chr(31)、四类编译错误、
      #     摘要提示词判语言、检索零命中泄漏、硬链接去重 等）
      #
      # ## 为什么不直接卡住
      #
      # 这些失败**不是新提交引入的**。用它当门禁只会让人绕过 CI
      # （改代码去迁就坏测试，或者干脆不跑）。
      #
      # 观察模式的价值：测试**照跑**、失败**照报**、日志**照存**，
      # 但不阻塞合并。债务仍然可见，只是不再假装它已经清完了。
      #
      # ## 什么时候收紧
      #
      # 把 core:plugin 那 9 个清零后，删掉这一步的 continue-on-error，
      # 并把模块列表并回上面的严格步骤。
      - name: Unit tests (JVM modules, observation)
        continue-on-error: true
        run: |
          # --continue：Gradle 默认在第一个失败任务后停止执行后续任务，
          # 于是 :core:plugin:test 一红，排在它后面的模块全部不跑。
          # 加了之后每个模块都会跑，失败各自记账（步骤仍是 continue-on-error）。
          #
          # --rerun-tasks --no-build-cache：这一步的用途是**观察**，
          # 而 UP-TO-DATE / FROM-CACHE 会让它什么都没跑却看起来跑过了
          # （实测 :core:data:test 就是这么被跳过的）。宁可慢，也要真跑。
          timeout --signal=KILL 2400 ./gradlew \
            --continue \
            --rerun-tasks \
            --no-build-cache \
            :core:ai:test \
            :core:data:test \
            :core:gateway:test \
            :core:goal:test \
            :core:linux:test \
            :core:memory:test \
            :core:model:test \
            :core:plugin:test \
            :core:terminal:test \
            :core:tool:test \
            :core:workflow:test \
            --stacktrace

      # ## 为什么需要一个单独的汇总步骤（2026-11-08）
      #
      # Gradle 在测试**全部通过**时什么都不打印 —— 只有失败时才输出
      # `N tests completed, M failed`。于是「日志里没有 FAILED」既可能是全绿，
      # 也可能是这个模块压根没跑（UP-TO-DATE / FROM-CACHE / 被前面的失败挡住）。
      # 两种情况在日志上长得一模一样，这是最危险的一类假绿。
      #
      # 这一步直接读 build/test-results 下的 XML，把每个模块的
      # tests / failures / 失败类名打出来。跑了没跑、过没过，一眼可见。
      - name: Summarize JVM test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          suites = []
          for path in glob.glob('**/build/test-results/**/*.xml', recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              suites.append((
                  root.get('name', path),
                  int(root.get('tests', 0) or 0),
                  int(root.get('failures', 0) or 0),
                  int(root.get('errors', 0) or 0),
              ))

          total = sum(s[1] for s in suites)
          failed = sum(s[2] + s[3] for s in suites)
          print(f'test suites: {len(suites)}  tests: {total}  failed: {failed}')
          for name, tests, failures, errors in sorted(suites, key=lambda s: -(s[2] + s[3])):
              if failures or errors:
                  print(f'  FAILED  {name}: {tests} tests, {failures} failures, {errors} errors')
          if not suites:
              print('  (没有任何测试结果 XML —— 说明测试根本没跑)')
          PY

      # ## :feature:chat 必须**逐类**跑（2026-11-07，R15 补）
      #
      # 全量跑时它会挂起：实测在 CI 上 `> Task :feature:chat:testDebugUnitTest`
      # 之后 38 分钟零输出，直到 wall-clock timeout 把它杀掉（exit 124）。
      #
      # ## 为什么逐类就好
      #
      # 17 个测试类**单独跑全部正常**（本地实测每个 24~83 秒，其中大部分是
      # Gradle 启动开销）。所以问题不在某个类，而在「一次跑全部」这个模式本身 ——
      # 具体原因还没查到（跨类共享状态？测试框架的清理顺序？）。
      #
      # 逐类的价值不是绕过它，而是**让它可定位**：哪一类挂起，日志里就直接
      # 看得出是哪一类，而不是只知道「这个任务卡了」。这也是 :app 那一步
      # 早就采用同一做法的原因。
      - name: Unit tests (:feature:chat, per class)
        run: |
          set +e
          failed=0
          for CT in ChatContinueTest ChatStageTest ChatStreamingTextTest \
                    ChatTitleTriggerTest ChatWiringGuardTest MessageContextMenuTest \
                    MessageEditorPartsTest MessageDeletePersistenceTest \
                    PendingQueueCodecTest PendingQueueTest ReasoningPersistenceTest \
                    SendActionModeTest SessionTitleTest SlashQueryTest \
                    ThrottledContentWriterTest ToolCardExecutingTest BuildTurnEntriesTest; do
            echo "::group::$CT"
            timeout --signal=KILL 240 ./gradlew :feature:chat:testDebugUnitTest \
              --tests "*$CT" --stacktrace
            rc=$?
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then
              echo "::error::$CT 失败或超时（exit=$rc）"
              failed=$((failed + 1))
            fi
          done
          if [ $failed -ne 0 ]; then
            echo "::error::$failed 个 :feature:chat 测试类失败/超时"
            exit 1
          fi

      # 逐个类跑 :app。任何一个出问题都算失败，但**不提前退出** ——
      # 要让其余类也跑完，这样一次 CI 就能拿到完整名单。
      - name: Unit tests (:app, per class)
        run: |
          set +e
          failed=0
          for CT in MemoryPortImplTest ToolWorkflowPortTest HardLinkParseTest \
                    ProotLoaderStagingTest SessionShutdownTest WiringGuardTest; do
            echo "::group::$CT"
            timeout --signal=KILL 240 ./gradlew :app:testDebugUnitTest \
              --tests "*$CT" --stacktrace
            rc=$?
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then
              echo "::error::$CT 失败或超时（exit=$rc）"
              failed=$((failed + 1))
            fi
          done
          if [ $failed -ne 0 ]; then
            echo "::error::$failed 个 :app 测试类失败/超时"
            exit 1
          fi

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
          retention-days: 7
          if-no-files-found: ignore

  # ── 构建 APK ─────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ## 为什么不是直揃 `sdkmanager "platforms;android-37"`
      #
      # 实测会失败：`Failed to find package 'platforms;android-37'`。
      # 原因：37 还没进稳定通道。它在 **canary 通道**，而且要带 minor
      # 版本号（包名是 `platforms;android-37.0`，对应本机 `android-37.0/`
      # 目录里的 `AndroidVersion.ApiLevel=37.0`）。
      #
      # 所以：先开 canary 通道，再装 `android-37.0`。
      # 容错：如果上游仍找不到（通道改名 / 版本上调），**不阻断构建** ——
      # 让 Gradle 自己报「缺 platform」，那比在装 SDK 阶段就停下更好排查。
      - name: Install Android SDK platform 37
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::warning::sdkmanager 不在预期路径，跳过（由 Gradle 自己报缺 platform）"
            exit 0
          fi
          # 先试稳定包名，再试 canary 通道的 37.0
          set +e
          yes | "$SDKMANAGER" --install "platforms;android-37" > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "稳定通道没有 android-37，改试 canary 通道的 android-37.0"
            yes | "$SDKMANAGER" --channel=3 --install "platforms;android-37.0" > /dev/null 2>&1
          fi
          # build-tools 37 同样可能不存在；存在就装，不存在用现有的。
          yes | "$SDKMANAGER" --install "build-tools;37.0.0" > /dev/null 2>&1
          set -e
          echo "当前已装 platforms:"
          ls "$ANDROID_SDK_ROOT/platforms" 2>/dev/null || true
          echo "当前已装 build-tools:"
          ls "$ANDROID_SDK_ROOT/build-tools" 2>/dev/null || true

      # ## 为什么 CI 要单独调大堆
      #
      # 首次 CI 实测失败：`java.lang.OutOfMemoryError: Metaspace`
      # （Kotlin FIR 解析阶段炸的，不是编译出错）。
      #
      # `gradle.properties` 里是 `-Xmx2g -XX:MaxMetaspaceSize=768m` —— 那是为
      # **本地 proot 省内存**定的（见该文件的注释），不是给 CI 的。
      # 18 个模块 + Compose 编译器插件生成大量合成类，768m Metaspace 不够。
      #
      # runner 有 7GB+，直接给 4g 堆 / 2g Metaspace。
      # 只在 CI 这一次性 checkout 里改，不提交回仓库 —— 本地 proot 仍然用
      # gradle.properties 里的 2g / 768m（那个值是为省宿主内存定的）。
      #
      # ## 为什么不能整个替换 gradle.properties（2026-11-01 修）
      #
      # 原来的写法是「写一份 gradle.properties.ci 再 mv 覆盖」。那会把仓库里
      # 其余配置一并抹掉 —— android.useAndroidX、android.nonTransitiveRClass、
      # org.gradle.parallel / caching / configuration-cache、
      # kotlin.compiler.execution.strategy=in-process 全部消失。
      # 其中缺 useAndroidX 会让 AGP 直接拒绝构建。
      #
      # 改成只替换 jvmargs 这一行、再追加两项，原有内容不动。
      - name: Tune Gradle memory for CI
        run: |
          sed -i 's|^org\.gradle\.jvmargs=.*|org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dfile.encoding=UTF-8|' gradle.properties
          {
            echo "kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g"
          } >> gradle.properties
          echo "--- gradle.properties (CI) ---"
          cat gradle.properties
          # 守一道：缺 useAndroidX 时 AGP 会拒绝构建，早点报比编译阶段炸好
          grep -q '^android.useAndroidX=true' gradle.properties \
            || { echo "::error::gradle.properties 丢了 android.useAndroidX"; exit 1; }

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # ## 为什么默认是 assembleDebug
      #
      # release 需要签名密钥，仓库里没有（也不该有）keystore。
      # 默认走 debug，保证「点一下就有一个能装的 APK」。
      - name: Build
        run: ./gradlew ${{ github.event.inputs.task || 'assembleDebug' }} --stacktrace

      - name: Locate APK
        id: apk
        run: |
          set -e
          found=$(find app/build/outputs/apk -name "*.apk" -type f | head -1)
          if [ -z "$found" ]; then
            echo "::error::没找到 APK，构建可能没有真正产出产物"
            exit 1
          fi
          echo "path=$found" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$found")" >> "$GITHUB_OUTPUT"
          ls -lh "$found"

      - name: Upload APK
        # 只要构建出了 APK 就上传 —— push 触发的构建同样需要能下载。
        #
        # 原来只在 workflow_dispatch 且 upload_artifact != false 时才传。
        # 结果 push 触发的 run 里 APK 被静默跳过，只剩 verify-reports，
        # 从产物列表看就像「构建没产出 APK」。
        uses: actions/upload-artifact@v4
        with:
          name: praxis-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
          if-no-files-found: error
