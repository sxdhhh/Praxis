name: build

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Gradle task'
        required: true
        default: assembleDebug
        type: choice
        options:
          - assembleDebug
          - assembleRelease
      upload_artifact:
        description: 'Upload APK as artifact'
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
      - 'feature/**'
      - 'ui/**'
      - 'third_party/**'
      - 'gradle/**'
      - 'build-plugins/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build.yml'

jobs:
  build:
    # ubuntu-latest 自带 JDK 17，但本项目要 21（PraxisBuildConfig.JDK_VERSION），
    # 所以显式用 setup-java 装 21，不依赖 runner 预装。
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # third_party/maven 里有 23 个 AAR（约 3.8MB），是 fan.miuix 的唯一来源，
          # 不存在于任何公开 Maven 仓库（GitHub Packages 要求组织成员权限）。
          # 它们已经在 git 里，正常 checkout 即可。
          fetch-depth: 1

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # local.properties 被 .gitignore 排除，CI 里没有，必须现写。
      # 不写的话 AGP 报 "SDK location not found"。
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # 只跑 lint 与编译，不跑测试：本仓库没有 instrumentation 测试，
      # 单元测试需要额外配置（见各模块 build.gradle.kts 的 testImplementation）。
      - name: Build
        run: |
          ./gradlew ${{ inputs.task || 'assembleDebug' }} \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          TASK="${{ inputs.task || 'assembleDebug' }}"
          case "$TASK" in
            assembleRelease) DIR=app/build/outputs/apk/release ;;
            *)               DIR=app/build/outputs/apk/debug   ;;
          esac
          APK=$(find "$DIR" -maxdepth 1 -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::APK not found in $DIR"
            ls -la "$DIR" || true
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          echo "Found: $APK ($(du -h "$APK" | cut -f1))"
          # 打出的包名与版本，用于核对（debug 带 .debug 后缀）
          "$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)/aapt2" \
            dump badging "$APK" 2>/dev/null | head -3 || true

      - name: Upload APK
        if: ${{ inputs.upload_artifact != false }}
        uses: actions/upload-artifact@v4
        with:
          name: praxis-apk
          path: ${{ steps.apk.outputs.apk }}
          retention-days: 7

      # 构建失败时把 gradle 报告传上去 —— 否则只有一个 "exit code 1"，
      # 看不到具体哪个文件的 Kotlin 报错。
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          retention-days: 3
          if-no-files-found: ignore