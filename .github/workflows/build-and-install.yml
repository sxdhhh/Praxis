# Praxis 构建 + 安装到设备
#
# ## 为什么需要这个文件
#
# 在此之前 Praxis **没有任何 workflow**：`/api/repos/sxd/Praxis/actions`
# 返回 `total_count: 0`。LocalHub 的 Actions 是 GitHub Actions 兼容语法
# （`on` / `jobs` / `runs-on: self-hosted` / `steps`），runner 就跑在
# 这台机器上，所以 `run:` 里能直接用本地 Android SDK 与 USB 设备。
#
# ## 为什么用 workflow_dispatch 而不是 push
#
# 构建产物要落到**本机设备**上（`pm install`），这是「我现在要装一版」的
# 动作，不是每次 push 都该做的事。push 触发会让日常提交也去抢设备。
# 需要自动构建时再加 `on.push`，但那应该是另一个 workflow（只产出 artifact）。
#
# ## 为什么 debug 而不是 release
#
# 本机没有 keystore（`/root/.keys/` 不存在），`app/build.gradle.kts:113-128`
# 的逻辑是「缺 PRAXIS_STORE_PASS / PRAXIS_KEY_PASS 就不建 release 签名配置」，
# 此时 release 产物是**未签名**的，装不上。debug 自带 debug 签名，可直接安装。
#
# 注意 `applicationIdSuffix = ".debug"`（app/build.gradle.kts:134），
# 所以 debug 包名是 `dev.praxis.debug` —— 与 release 的 `dev.praxis` 并存，
# 不会覆盖正式版。
name: build-and-install

on:
  workflow_dispatch:
    inputs:
      install:
        description: '构建完成后装到设备（pm install -r）'
        type: boolean
        default: true
      task:
        description: 'Gradle 任务'
        type: choice
        options: [assembleDebug, assembleRelease]
        default: assembleDebug

# 同一时刻只允许一个构建在跑。
#
# 理由不是「避免重复」，而是**内存**：本机 MemAvailable 常年在 1.5~1.7G，
# 两个 Gradle daemon 并行必然被 LMK 杀掉（表现是编译到一半进程静默消失，
# 日志里连 OOM 都不留）。串行是硬要求。
concurrency:
  group: praxis-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: 环境自检
        run: |
          echo "JAVA: $(java -version 2>&1 | head -1)"
          echo "SDK:  ${ANDROID_HOME:-/opt/android-sdk}"
          ls /opt/android-sdk/platforms/
          echo "MemAvailable: $(grep MemAvailable /proc/meminfo)"

      - name: 写 local.properties
        # local.properties 被 .gitignore 排除，CI 里没有。
        # 不写这个文件，AGP 会因为找不到 sdk.dir 直接失败。
        run: |
          echo "sdk.dir=/opt/android-sdk" > local.properties
          cat local.properties

      - name: 构建
        # 用 --no-daemon：构建结束后不要留一个 2g 堆的 JVM 常驻。
        # 本机内存紧张，留着它会让后续任何一次构建都撞 LMK。
        # 代价是每次冷启动多约 20 秒，换来的是「不会莫名其妙被杀」。
        run: |
          ./gradlew ${{ inputs.task || 'assembleDebug' }} \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: 定位产物
        id: apk
        run: |
          set -euo pipefail
          if [ "${{ inputs.task || 'assembleDebug' }}" = "assembleRelease" ]; then
            DIR=app/build/outputs/apk/release
          else
            DIR=app/build/outputs/apk/debug
          fi
          # AGP 9 的产物文件名带版本号与 abi 后缀，不能写死名字，按目录扫。
          APK=$(find "$DIR" -maxdepth 1 -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::找不到 APK，检查 $DIR"
            ls -la "$DIR" 2>/dev/null || true
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "产物: $APK ($(du -h "$APK" | cut -f1))"
          # 包名与版本，装完核对用
          /opt/android-sdk/build-tools/35.0.0/aapt2 dump badging "$APK" 2>/dev/null \
            | head -2 || true

      - name: 安装到设备
        if: ${{ inputs.install }}
        run: |
          set -euo pipefail
          ADB=/opt/android-sdk/platform-tools/adb
          # pm install 比 adb install 更能反映真实安装结果（返回 Success 才算），
          # 而且不受 adb server 状态影响。
          adb push "${{ steps.apk.outputs.apk }}" /data/local/tmp/praxis.apk
          adb shell pm install -r -t /data/local/tmp/praxis.apk
          adb shell rm -f /data/local/tmp/praxis.apk
          echo "已安装，当前包列表："
          adb shell pm list packages | grep praxis || true

      - name: 上传产物
        # 即使 install=false 也留一份可下载的包。
        uses: actions/upload-artifact@v4
        with:
          name: praxis-apk
          path: ${{ steps.apk.outputs.apk }}
          retention-days: 7
