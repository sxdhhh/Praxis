# ── Gradle JVM ─────────────────────────────────────────
#
# ## 为什么是 -Xmx3g 而不是 4g
#
# 本机物理内存 11.5G，但**可回收可用内存只有 1~2G**
# （宿主常驻服务 + 多个 proot 会话占掉其余部分，见 /proc/meminfo 的 MemAvailable）。
# 原来的 `-Xmx4g` 纸面够用，实际会一路膨胀到 4G，把宿主压进 LMK
# （低内存杀手）名单 —— 表现是「编译到一半进程被静默杀掉」，
# 日志里连 OOM 都不留，只有 build 失败。
#
# 3g 是折中：Gradle daemon + Kotlin daemon 同时活动时峰值约 2.2~2.8G，
# 留出余量给宿主。宁可慢一点，也不要被杀掉重跑一次。
#
# `-XX:MaxMetaspaceSize` 显式封顶：Compose 编译器插件会生成大量
# 合成类，Metaspace 不设上限时会涨到不可控。
# HeapDumpOnOutOfMemoryError 是为了「真 OOM 时留下证据」，
# 否则只能看到一句 "Gradle build daemon disappeared"。
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ── 并行与缓存 ─────────────────────────────────────────
#
# `max-workers` 显式设 8 而不是留给默认值：
# 默认值按 CPU 核数（8）算，但真正的瓶颈是那 1~2G 可用内存，
# 不是 CPU。16 个模块并行 + 8 worker 已经在内存边界上，
# 再放大只会让 GC 抢走 CPU。
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.max-workers=8

# 配置缓存：跳过重复的 settings/脚本求值。
# problems=warn 而不是 fail —— 首次开启时若有插件不兼容，
# 让它降级成「本次不缓存」而不是让整个构建失败。
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# 文件系统监听关闭：容器内 inotify 配额有限，
# 多个 proot 会话共享后容易触发 "Too many open files"。
org.gradle.vfs.watch=false

# ── Kotlin ─────────────────────────────────────────────
#
# 增量编译 + 独立 Kotlin daemon 的堆上限。
# 不设 jvmargs 时 Kotlin daemon 默认继承较大堆，与 Gradle daemon
# 叠加后是内存超支的第二大来源。
kotlin.incremental=true

# ## 为什么是 in-process，而不是 daemon
#
# 实测环境里 `MemAvailable` 只有 1.5~1.7G，而 Swap 已用掉 6.8G。
# daemon 模式的代价是**两个常驻 JVM**（Gradle 2g + Kotlin 1.5g），
# 峰值直接把宿主压进 LMK —— 现象是构建日志在某个
# `> Task :xxx:compileDebugKotlin` 行戛然而止：
# 没有 `BUILD FAILED`、没有 `hs_err`、没有 OOM 堆栈，进程直接消失。
#
# in-process 把 Kotlin 编译放进 Gradle daemon 那一个 2g 堆里。
# 代价是「编译与配置共用堆」，收益是不再有 JVM 之间的内存叠加。
# 在这种内存条件下，这是唯一能稳定跑完的选择。
kotlin.compiler.execution.strategy=in-process

# ── Android ────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true
